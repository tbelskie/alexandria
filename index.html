<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alexandria — a curated open digital library. What Project Gutenberg’s front door should have been."
    />
    <meta name="theme-color" content="#0e1016" />
    <title>Alexandria — Open Library for Humans</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: #0a0b0f;
        color: #f3ebdc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Clear legacy cache-first SW that pinned broken hashed assets (blank white).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) {
            r.unregister()
          })
        })
      }
      if (window.caches) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) {
            if (k.indexOf('alexandria') === 0) caches.delete(k)
          })
        })
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
